name: L9 Full Grounded Regression

on:
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE || 'https://api.deepseek.com/v1' }}
      MODEL_NAME: ${{ vars.MODEL_NAME || 'deepseek-chat' }}
      LLM_COST_PER_1K_TOKENS_USD: ${{ vars.LLM_COST_PER_1K_TOKENS_USD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Require API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is required for full regression."
            exit 1
          fi

      - name: Run full regression gate
        run: python scripts/run_all_tests.py

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l9-full-regression-${{ github.run_id }}
          path: |
            runs/latest/
            runs/history/
          if-no-files-found: warn
          retention-days: 30
